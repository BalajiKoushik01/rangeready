name: RangeReady code health
on:
  pull_request:
  push:
    branches: ["ci/**", "main"]
jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application Python source
        run: python -m compileall -q backend
      - name: Reject unresolved source merge markers
        run: |
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- 'backend/*.py' 'backend/**/*.py'; then
            exit 1
          fi
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
